[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old Wix URLs, redirected to their new homes so existing links and search results keep working.
[[redirects]]
  from = "/products-services"
  to = "/retreads/"
  status = 301
[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/bru-info"
  to = "/why-retread/"
  status = 301
[[redirects]]
  from = "/environment"
  to = "/why-retread/environmental-case/"
  status = 301
[[redirects]]
  from = "/gallery"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/downloads"
  to = "/resources/"
  status = 301
[[redirects]]
  from = "/videos"
  to = "/retreads/"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301
